<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3GEG3M12D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T3GEG3M12D');
    </script>

    <title>Upskillab - Learn Skills Online</title>

    <!-- ✅ SEO Meta -->
    <meta
      name="keywords"
      content="upskillab, upskill lab, upskilling, online education, online learning, career development, professional skills"
    />
    <meta
      name="description"
      content="Upskillab offers premium online courses to help you learn new skills, grow your career, and achieve your goals."
    />

    <!-- ✅ Open Graph Tags -->
    <meta property="og:title" content="Upskillab - Learn Skills Online" />
    <meta
      property="og:description"
      content="Upskillab offers online courses to improve your skills and career. Start learning today!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://upskillab.com" />
    <meta property="og:image" content="https://upskillab.com/images/og-image.jpg" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Upskillab - Learn Skills Online" />
    <meta
      name="twitter:description"
      content="Join Upskillab to access premium online courses that empower your future."
    />
    <meta name="twitter:image" content="https://upskillab.com/images/og-image.jpg" />

    <!-- ✅ JSON-LD Structured Data -->

    <!-- Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Upskillab",
      "url": "https://upskillab.com/",
      "logo": "https://upskillab.com/images/Logo.svg",
      "sameAs": [
        "https://www.facebook.com/upskillab",
        "https://www.instagram.com/upskillab",
        "https://www.linkedin.com/company/upskillab",
        "https://twitter.com/upskillab"
      ]
    }
    </script>

    <!-- Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://upskillab.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://upskillab.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Breadcrumb -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://upskillab.com/"
        }
      ]
    }
    </script>

    <!-- Example Courses (repeat for featured ones) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Full-Stack Web Development Bootcamp",
      "description": "Learn React, Node.js, databases, and deployment to become a professional full-stack developer.",
      "provider": {
        "@type": "Organization",
        "name": "Upskillab",
        "sameAs": "https://upskillab.com/"
      },
      "offers": {
        "@type": "Offer",
        "url": "https://upskillab.com/courses/fullstack-web-dev",
        "priceCurrency": "INR",
        "price": "4999",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Digital Marketing Mastery",
      "description": "Master SEO, Google Ads, social media, and analytics to accelerate your career in digital marketing.",
      "provider": {
        "@type": "Organization",
        "name": "Upskillab",
        "sameAs": "https://upskillab.com/"
      },
      "offers": {
        "@type": "Offer",
        "url": "https://upskillab.com/courses/digital-marketing",
        "priceCurrency": "INR",
        "price": "3999",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
