<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T3GEG3M12D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T3GEG3M12D');
    </script>

    <title>Upskillab</title>

    <!-- ✅ SEO Meta Description -->
    <meta
      name="description"
      content="Upskillab is your destination for high-quality online education. Join now to explore a wide range of career-boosting courses!"
    />

    <!-- ✅ SEO Meta Keywords -->
    <meta
      name="keywords"
      content="upkillab, upskilllab, upskilling, upskill lab, online upskillab, online education upskillab, education upskillab, online learning, career development"
    />

    <!-- ✅ Open Graph Tags for social sharing -->
    <meta property="og:title" content="Upskillab - Learn Skills Online" />
    <meta
      property="og:description"
      content="Upskillab offers online courses to improve your skills and career. Start learning today!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://upskillab.com" />
    <meta property="og:image" content="https://upskillab.com/images/social-share.jpg" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Upskillab - Learn Skills Online" />
    <meta
      name="twitter:description"
      content="Join Upskillab to access premium online courses that empower your future."
    />

    <!-- ✅ Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Upskillab",
      "url": "https://upskillab.com/",
      "logo": "https://upskillab.com/images/Logo.svg",
      "sameAs": [
        "https://www.facebook.com/upskillab",
        "https://www.instagram.com/upskillab",
        "https://www.linkedin.com/company/upskillab",
        "https://twitter.com/upskillab"
      ]
    }
    </script>

    <!-- ✅ Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://upskillab.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://upskillab.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
